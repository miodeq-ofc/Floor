<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090f" />
    <title>Ekran graczy — The Floor</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/extra.css" />
    <link rel="stylesheet" href="assets/css/floor.css" />
  </head>
  <body class="screen board floor-board">
    <header class="game-top board-top">
      <div class="brand">
        <span class="brand-mark">TF</span>
        <span>
          <span class="brand-name">THE FLOOR</span>
          <span class="brand-sub">ekran graczy · by Mateusz</span>
        </span>
      </div>
      <div class="turn-label">
        <span class="t1" id="board-kicker">THE FLOOR</span>
        <span class="t2" id="board-title">Czekam na prowadzącego</span>
      </div>
      <div class="board-cat" id="board-cat" hidden>—</div>
      <div class="board-turn" id="board-turn" aria-live="polite" hidden>
        <span>WYBIERA:</span>
        <b id="board-turn-name">—</b>
      </div>
      <div class="top-spacer"></div>
      <div class="top-actions">
        <span class="conn"><span class="dot" id="board-dot"></span><span id="board-conn">Łączę…</span></span>
        <button class="icon-btn" id="board-sound" type="button" title="Dźwięk" aria-label="Włącz lub wyłącz dźwięk">🔊</button>
        <button class="icon-btn" id="board-fullscreen" type="button" title="Pełny ekran" aria-label="Pełny ekran">⛶</button>
        <a class="icon-btn" href="index.html" title="Menu" aria-label="Menu">☰</a>
      </div>
    </header>

    <main class="board-main">
      <section class="board-screen" id="board-screen">
        <div class="board-stage">
          <div class="floor-grid board-floor" id="board-floor"></div>
        </div>
        <div class="board-bottom">
          <div class="board-caption" id="board-caption">Prowadzący ustawia grę…</div>
          <div class="legend board-legend" id="board-legend"></div>
        </div>
      </section>

      <section class="duel-screen" id="duel-screen" hidden>
        <div class="duel-players" id="duel-players"></div>
        <div class="duel-stage" id="duel-stage">
          <img class="duel-image" id="duel-image" alt="" hidden />
          <div class="duel-loading" id="duel-loading"><div class="spinner"></div><span>Przygotowuję pytanie…</span></div>
          <div class="duel-prompt" id="duel-prompt">—</div>
        </div>
        <div class="mini-board-wrap">
          <div class="mini-label">PLANSZA</div>
          <div class="floor-grid mini" id="mini-floor"></div>
          <div class="mini-legend" id="mini-legend"></div>
        </div>
      </section>
    </main>

    <div class="answer-banner hidden" id="answer-banner" role="status" aria-live="polite">
      <div class="answer-banner-text" id="answer-banner-text">—</div>
    </div>

    <div class="conquest-banner hidden" id="conquest-banner">
      <div class="conquest-kicker">TERYTORIUM ZDOBYTE</div>
      <div class="conquest-title" id="conquest-title">—</div>
      <div class="conquest-note" id="conquest-note">—</div>
    </div>

    <div class="overlay hidden" id="board-overlay">
      <div class="overlay-card" id="board-overlay-card"></div>
    </div>

    <div class="waiting-card" id="waiting-card">
      <div class="waiting-logo">TF</div>
      <h1>THE FLOOR</h1>
      <p>Ekran graczy czeka na prowadzącego.<br />Otwórz drugie okno i ustaw grę.</p>
      <a class="btn btn-primary" href="host.html" target="_blank" rel="noopener">Otwórz ekran prowadzącego</a>
      <a class="btn btn-ghost" href="index.html">Strona główna</a>
    </div>

    <script type="module" src="assets/js/board.js"></script>
  </body>
</html>
